# Matugen template for rx-greeter.
#
# Register in ~/.config/matugen/config.toml:
#
#   [templates.rx-greeter]
#   input_path = "$HOME/.config/matugen/templates/rx-greeter.conf"
#   output_path = "$HOME/.config/rx-greeter/theme.conf"
#
# scripts/install-user-theme.sh does this for you (with a backup).
#
# Host policy (theme_path, background_image, default_user, default_session,
# power_helper, session_dirs) belongs in /etc/rx-greeter/config.conf or
# ~/.config/rx-greeter/config.conf, not here.

background_color = {{ colors.surface.default.hex }}
background_overlay = 0.22

surface_color = {{ colors.surface_container.default.hex }}
surface_opacity = 0.80
text_color = {{ colors.on_surface.default.hex }}
primary_color = {{ colors.primary.default.hex }}
error_color = {{ colors.error.default.hex }}
outline_color = {{ colors.outline.default.hex }}

box_width = 240
box_height = 42
border_radius = 0
box_x = 0
box_y = 0

dot_spacing = 9
dot_radius = 2.4

font_family = IosevkaTerm Nerd Font Mono
fallback_font_family = IosevkaTerm Nerd Font Mono
font_size = 16

fade_ms = 250
animation_ms = 200
element_opacity = 1.0
element_spacing = 15
show_cursor = true

show_clock = true
show_date = true
clock_format = %H:%M
date_format = %A, %B %d
clock_font_family = IosevkaTerm Nerd Font Mono
clock_font_size = 50
date_font_size = 17
clock_color = {{ colors.on_surface.default.hex }}
clock_x = 0
clock_y = -170

show_help_tips = false
help_tips_font_size = 11
help_tips_color = {{ colors.outline.default.hex }}

show_caps_lock_indicator = true
caps_lock_font_size = 12
caps_lock_color = {{ colors.tertiary.default.hex }}

show_user_selector = true
show_session_selector = true
show_power_buttons = true
show_selector_preview = true
selector_preview_font_size = 13
selector_preview_color = {{ colors.outline.default.hex }}
selector_preview_margin = 10
selector_height = 35
selector_spacing = 10
selector_font_size = 14
selector_arrow_font_size = 17
selector_arrow_width = 30
selector_radius = 10

allow_empty_password = false
clear_password_on_error = true
login_error_shake = true
login_error_border_width = 4
error_hold_ms = 900
auth_timeout_ms = 30000

power_dry_run = false
