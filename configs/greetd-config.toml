# Example /etc/greetd/config.toml entry for rx-greeter.
#
# Back up the live file before changing it:
#   sudo cp -a /etc/greetd/config.toml /etc/greetd/config.toml.bak
#
# Do not apply this until rx-greeter has passed the nested/mock tests and a
# spare-TTY or VM test. The live greeter should remain usable.

[terminal]
vt = 7

[default_session]
command = "/usr/local/bin/rx-greeter-session"
user = "greetd"

# If the Matugen theme lives in a user's home and you do not install a system
# /etc/rx-greeter/config.conf, point at the host config explicitly:
#
# command = "/usr/bin/env RX_GREETER_CONFIG=/home/ranxom/.config/rx-greeter/config.conf /usr/local/bin/rx-greeter-session"
