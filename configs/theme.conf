# rx-greeter theme example.
#
# Colors and field geometry deliberately use the same key names as waylock.
# The defaults below match the live waylock theme on this machine; the
# Matugen template in configs/matugen/rx-greeter.conf regenerates this file
# from the current wallpaper palette.
#
# Host policy (theme path, wallpaper, default user/session, power helper) lives
# in /etc/rx-greeter/config.conf or ~/.config/rx-greeter/config.conf. This file
# only owns appearance. Set background_image there, or let the runtime fall
# back to ~/.cache/swaylock-bg.png and the system asset paths.
#
# Wallpaper images must be PNG for Cairo's image loader.

background_color = #121415
background_overlay = 0.22

surface_color = #1e2021
surface_opacity = 0.80
text_color = #e2e2e3
primary_color = #a2cdde
error_color = #ffb4ab
outline_color = #8b9295

# Password field geometry. x/y are offsets from screen center.
box_width = 240
box_height = 42
border_radius = 0
box_x = 0
box_y = 0

dot_spacing = 9
dot_radius = 2.4

font_family = IosevkaTerm Nerd Font Mono
fallback_font_family = IosevkaTerm Nerd Font Mono
font_size = 16

fade_ms = 250
animation_ms = 200
element_opacity = 1.0
element_spacing = 15
show_cursor = true

# Clock and date. The VoidSDDM clock placeholders are replaced by strftime
# formats, so %H:%M, %H:%M:%S, %A and so on all work.
show_clock = false
show_date = false
clock_format = %H:%M
date_format = %A, %B %d
clock_font_family = IosevkaTerm Nerd Font Mono
clock_font_size = 50
date_font_size = 17
clock_color = #e2e2e3
clock_x = 0
clock_y = -170

show_help_tips = false
help_tips_font_size = 11
help_tips_color = #8b9295

show_caps_lock_indicator = true
caps_lock_font_size = 12
caps_lock_color = #ffaa00

# Selectors.
show_user_selector = true
show_session_selector = true
show_power_buttons = true
show_selector_preview = true
selector_preview_font_size = 13
selector_preview_color = #8b9295
selector_preview_margin = 10
selector_height = 35
selector_spacing = 10
selector_font_size = 14
selector_arrow_font_size = 17
selector_arrow_width = 30
selector_radius = 10

# Login behaviour.
allow_empty_password = false
clear_password_on_error = true
login_error_shake = true
login_error_border_width = 4
error_hold_ms = 900
auth_timeout_ms = 30000

# Power helper policy is configured in config.conf. The greeter falls back to
# a sibling rx-greeter-power executable and standard libexec locations.
power_dry_run = false
