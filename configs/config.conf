# rx-greeter host configuration.
#
# Install as /etc/rx-greeter/config.conf (system-wide) or keep in
# ~/.config/rx-greeter/config.conf for a single-user/manual setup. The greeter
# reads it after the visual theme, so these values win.
#
# Empty values mean "automatic":
#   default_user    -> first selectable human user
#   default_session -> first available Wayland session
#   background_image-> search ~/.cache, /var/lib, /etc, /usr/share
#   power_helper    -> sibling rx-greeter-power, then libexec paths

# theme_path = /etc/rx-greeter/theme.conf
# background_image = /var/lib/rx-greeter/background.png
# default_user =
# default_session =
# output = eDP-1
# session_dirs = /usr/local/share/wayland-sessions:/usr/share/wayland-sessions
# power_helper = /usr/local/libexec/rx-greeter-power
# power_dry_run = false
